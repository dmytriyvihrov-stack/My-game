<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RABBLEBOUND - The Foe Dex</title>
<meta name="theme-color" content="#14110d">
<!-- ═══════════════════════════════════════════════════════════════════════
     THE FOE DEX - every enemy the game can field, in one table.

     It is NOT part of the game and the game does not know it exists. Every
     figure in it is DERIVED off the running build by tools/dev/probes/foedex.js
     and laid out by tools/dev/build_foedex.py, so a statblock change moves this
     file by itself. Nothing here is authored twice.

     To regenerate:
       python tools/dev/gt.py launch
       python tools/dev/gt.py eval tools/dev/probes/foedex.js > foedex.raw
       python tools/dev/build_foedex.py foedex.raw

     Every cell with a dotted underline is EDITABLE. Edits live in this
     browser (localStorage) and never touch the build; EXPORT hands you back
     only what you changed, so a rebuild can never lose your figures.
     ═══════════════════════════════════════════════════════════════════════ -->
<style>
:root{
  --bg:#14110d; --panel:#1b1712; --panel2:#221d17; --line:#332b21; --line2:#4d3c22;
  --ink:#e6dcc6; --dim:#8a7a5e; --faint:#5d5242;
  --gold:#c9a227; --gold-lit:#e0bd4a; --teal:#4a8f8b; --blood:#a8422f;
  --grain:#8ca35a; --steel:#96a1a5; --ore:#7d8a54; --wood:#b98a45;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
  --disp:"Cinzel",Georgia,serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:12px/1.45 var(--mono);
  display:flex;flex-direction:column;overflow:hidden}

/* ── chrome ───────────────────────────────────────────────────────────── */
#top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 14px;
  background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto}
.brand{font-family:var(--disp);letter-spacing:.22em;font-weight:700;color:var(--gold);
  font-size:14px;white-space:nowrap}
.brand small{color:var(--faint);letter-spacing:.1em;font-weight:400;margin-left:9px;
  font-family:var(--mono);font-size:10px}
button{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);
  padding:3px 10px;cursor:pointer}
button:hover{border-color:var(--gold);color:#fff}
button.on{background:var(--gold);color:#14110d;border-color:var(--gold);font-weight:700}
input,select{font:inherit;color:var(--ink);background:#100e0a;border:1px solid var(--line);
  padding:3px 7px}
input:focus,select:focus{outline:none;border-color:var(--gold)}
.grow{flex:1}
.tabs{display:flex;gap:2px}
.tabs button{letter-spacing:.12em;font-size:11px;padding:4px 15px}

#note{padding:6px 14px;background:#1d1a12;border-bottom:1px solid var(--line);
  color:var(--dim);font-size:11px;flex:0 0 auto}
#note b{color:var(--gold)}
#note .warn{color:var(--blood)}

.page{flex:1;min-height:0;overflow:auto;display:none}
.page.on{display:block}

/* ── the table ────────────────────────────────────────────────────────── */
table{border-collapse:separate;border-spacing:0;width:100%;font-size:11px}
thead th{position:sticky;top:0;z-index:5;background:#1f1a13;color:var(--dim);
  font-weight:700;letter-spacing:.1em;font-size:10px;text-transform:uppercase;
  padding:7px 6px;border-bottom:1px solid var(--line2);text-align:left;
  white-space:nowrap;cursor:pointer;user-select:none}
thead th:hover{color:var(--gold)}
thead th.sorted{color:var(--gold-lit)}
thead th .ar{color:var(--faint);font-weight:400}
tbody td{padding:5px 6px;border-bottom:1px solid #241f18;vertical-align:top}
tbody tr:hover td{background:#1a1610}
tbody tr.boss td{background:#1d1512}
tbody tr.boss:hover td{background:#241a15}

td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.pic{width:60px;padding:2px 6px !important}
.pic img{display:block;max-width:52px;max-height:52px;image-rendering:pixelated;
  filter:drop-shadow(0 1px 2px #000)}
.pic .noart{color:var(--faint);font-size:9px;letter-spacing:.08em}

/* the name column carries the flags under it, so it gets width rather than
   wrapping a two-word name onto two lines and stacking the flags into a tower */
tbody td:nth-child(2){min-width:158px;max-width:190px}
.nm{font-family:var(--disp);font-size:13px;color:var(--ink);line-height:1.25}
tr.boss .nm{color:var(--gold-lit)}
.sub{color:var(--faint);font-size:10px;letter-spacing:.06em;margin-top:3px}
.rc{display:inline-block;padding:0 4px;border:1px solid var(--line2);color:var(--dim);
  font-size:9px;letter-spacing:.09em;margin-right:4px}
.rc.human{color:#c9c2b4}.rc.ratkin{color:#a89a7c}.rc.ogre{color:#b98a45}
.rc.beast{color:var(--grain)}.rc.unknown{color:var(--steel)}
.fl{display:inline-block;color:var(--wood);font-size:9px;letter-spacing:.06em;margin-right:5px}
.fl.hot{color:var(--blood)}

/* threat */
.pts{font-family:var(--disp);font-size:15px;color:var(--gold-lit)}
.ptsb{display:block;height:3px;background:#2a2114;margin-top:3px;min-width:34px}
.ptsb i{display:block;height:3px;background:var(--gold)}
.ptspc{display:block;color:var(--faint);font-size:9px;margin-top:2px;white-space:nowrap}

/* skills */
.acts{display:flex;flex-direction:column;gap:3px;min-width:200px}
.act{background:#241c11;border:1px solid var(--line);border-left:2px solid var(--line2);
  padding:2px 6px;cursor:help}
.act b{color:var(--ink);font-weight:700;letter-spacing:.05em}
.act .d{color:var(--blood)}
.act .m{color:var(--dim)}
.act.arc{border-left-color:#a07cc9}
.act.swp{border-left-color:var(--blood)}
.act.rng{border-left-color:var(--teal)}
.act.util{border-left-color:var(--ore)}

/* the parties */
.parties{display:flex;flex-direction:column;gap:4px;min-width:230px}
.party{background:#1b1712;border:1px solid var(--line);padding:3px 6px}
.party b{color:var(--gold);font-family:var(--disp);font-size:11px;letter-spacing:.04em}
.party .pn{color:var(--faint);font-size:9px;float:right}
.party .cast{color:var(--dim);font-size:10px;line-height:1.4;margin-top:2px;clear:both}
.party .cast .me{color:var(--ink)}
.party .cast .ally{color:var(--grain)}

/* editable */
[contenteditable]{border-bottom:1px dotted var(--line2);min-width:18px;display:inline-block;
  outline:none;padding:0 1px}
[contenteditable]:hover{border-bottom-color:var(--gold);background:#241c11}
[contenteditable]:focus{border-bottom-color:var(--gold-lit);background:#2a2114;color:#fff}
td.edited{box-shadow:inset 2px 0 0 var(--grain)}

/* ── what was drawn and is never shown ────────────────────────────────
   (User: "add on the button of the list assets of charaters, that verre
   additionlly created but never used".) It sits UNDER the table, because it
   is the same census asking the opposite question. */
.act.mv{border-left-color:var(--faint);opacity:.75}
.act.pk{border-left-color:var(--gold);background:#2a2114}
.act.pk b{color:var(--gold-lit)}
/* the cards that put you in this fight */
.party .cards{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px;
  padding-top:4px;border-top:1px solid #241f18}
.cd{font-size:9px;letter-spacing:.04em;color:var(--wood);background:#1c150c;
  border:1px solid var(--line);padding:1px 5px;cursor:help}
.cd.fire{color:var(--grain)}
.cd.none{color:var(--faint);border-style:dashed;cursor:default}

/* ── the family rows: a group header inside the table ────────────────────
   (User: "Inside the groups beast and smaller group humans - made a
   subrgoups".) The header is a ROW, not a second table, so sorting a column
   still sorts the whole census and the grouping simply switches off. */
tbody tr.grp td{background:#221d17;border-top:1px solid var(--line2);
  border-bottom:1px solid var(--line2);padding:5px 8px}
tbody tr.grp:hover td{background:#221d17}
.grp .gh{font-family:var(--disp);font-size:12px;color:var(--gold);letter-spacing:.12em;
  font-weight:600}
.grp .gr{color:var(--faint);font-size:10px;letter-spacing:.08em;margin-left:10px}
.grp .gn{color:var(--dim);font-size:10px;margin-left:10px}

/* ── the champion, folded under the body it is a better version of ───────
   (User: "champions you can put in a toggle group near main creature".) */
tr.champ{display:none}
tr.champ.open{display:table-row}
tr.champ td{background:#1a1610;box-shadow:inset 3px 0 0 var(--gold)}
tr.champ:hover td{background:#211b13}
.chtog{background:#2a2114;border:1px solid var(--line2);color:var(--gold-lit);
  font-family:var(--mono);font-size:9px;letter-spacing:.06em;padding:0 5px;
  cursor:pointer;margin-top:4px;display:inline-block}
.chtog:hover{border-color:var(--gold);color:#fff}
.chmark{color:var(--gold-lit);font-size:9px;letter-spacing:.08em;margin-right:5px}

#orphans{padding:18px 14px 40px;border-top:2px solid var(--line2);margin-top:8px}
#orphans h2{font-family:var(--disp);font-size:16px;color:var(--wood);letter-spacing:.1em;
  margin:0 0 3px;font-weight:600}
#orphans .lead{color:var(--dim);font-size:11px;max-width:900px;margin-bottom:14px}
#orphans h4{font-family:var(--disp);font-size:12px;color:var(--gold);letter-spacing:.08em;
  margin:16px 0 6px;font-weight:600}
#orphans h4 span{color:var(--faint);font-family:var(--mono);font-size:10px;
  letter-spacing:0;margin-left:8px;font-weight:400}
.ocards{display:flex;flex-wrap:wrap;gap:8px}
.ocard{background:var(--panel);border:1px dashed var(--line2);padding:7px 9px;
  display:flex;gap:9px;align-items:flex-start;min-width:210px;max-width:290px}
.ocard img{max-width:46px;max-height:52px;image-rendering:pixelated;
  filter:drop-shadow(0 1px 2px #000)}
.ocard .on1{font-family:var(--disp);font-size:12px;color:var(--ink)}
.ocard .ok{color:var(--faint);font-size:9px;letter-spacing:.06em;word-break:break-all}
.ocard .od{color:var(--dim);font-size:10px;margin-top:3px;line-height:1.35}
.olist{display:flex;flex-wrap:wrap;gap:5px}
.otag{background:#241c11;border:1px dashed var(--line2);color:var(--dim);
  padding:2px 7px;font-size:10px}
.otag b{color:var(--ink);font-weight:400}
#orphans .none{color:var(--grain);font-size:11px}

/* ── the fights page ──────────────────────────────────────────────────── */
#fights{padding:14px;display:none;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));
  gap:12px;align-content:start}
#fights.on{display:grid}
.fcard{background:var(--panel);border:1px solid var(--line);padding:10px 12px}
.fcard h3{margin:0 0 2px;font-family:var(--disp);font-size:15px;color:var(--gold-lit);
  font-weight:600;letter-spacing:.04em}
.fcard .k{color:var(--faint);font-size:10px;letter-spacing:.08em;margin-bottom:8px}
.fcard .bands{display:flex;gap:6px;margin:8px 0;font-size:10px}
.fcard .bands span{flex:1;background:#100e0a;border:1px solid var(--line);padding:3px 5px;
  text-align:center;color:var(--dim)}
.fcard .bands b{display:block;font-family:var(--disp);font-size:14px;color:var(--ink)}
.fcard .bands .e b{color:var(--grain)}.fcard .bands .h b{color:var(--blood)}
.frow{display:flex;align-items:center;gap:7px;padding:3px 0;border-top:1px solid #241f18}
.frow img{max-width:26px;max-height:32px;image-rendering:pixelated}
.frow .fn{flex:1;color:var(--ink)}
.frow .fx{color:var(--gold);font-family:var(--disp);font-size:12px;width:26px;text-align:right}
.frow .fp{color:var(--faint);width:44px;text-align:right;font-size:10px}
.fally{margin-top:7px;padding-top:6px;border-top:1px solid var(--line);color:var(--grain);
  font-size:10px}
.ftot{margin-top:8px;padding-top:6px;border-top:1px solid var(--line2);
  display:flex;justify-content:space-between;color:var(--dim);font-size:11px}
.ftot b{color:var(--gold-lit);font-family:var(--disp);font-size:14px}

/* ── the export sheet ─────────────────────────────────────────────────── */
#sheet{position:fixed;inset:0;background:rgba(8,6,4,.86);display:none;
  align-items:center;justify-content:center;z-index:50}
#sheet.on{display:flex}
#sheet .box{background:var(--panel);border:1px solid var(--line2);width:min(880px,92vw);
  max-height:82vh;display:flex;flex-direction:column;padding:14px}
#sheet h3{margin:0 0 8px;font-family:var(--disp);color:var(--gold);letter-spacing:.1em;
  font-size:14px;font-weight:600}
#sheet textarea{flex:1;min-height:340px;background:#100e0a;color:var(--ink);
  border:1px solid var(--line);font:11px/1.4 var(--mono);padding:8px;resize:none}
#sheet .row{display:flex;gap:8px;margin-top:10px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:#100e0a}
::-webkit-scrollbar-thumb{background:#2f2a1f;border:2px solid #100e0a}
::-webkit-scrollbar-thumb:hover{background:var(--line2)}
</style>
</head>
<body>

<div id="top">
  <span class="brand">THE FOE DEX<small id="stamp"></small></span>
  <div class="tabs">
    <button id="tabFoes" class="on">ENEMIES</button>
    <button id="tabFights">FIGHTS</button>
  </div>
  <input id="q" placeholder="search name, skill, fight..." style="width:200px">
  <select id="race"><option value="">every race</option></select>
  <select id="fight"><option value="">every fight</option></select>
  <span class="grow"></span>
  <span id="count" style="color:var(--faint)"></span>
  <button id="exJson">EXPORT JSON</button>
  <button id="exCsv">EXPORT CSV</button>
  <button id="exMd">EXPORT MD</button>
  <button id="reset">RESET EDITS</button>
</div>

<div id="note"></div>

<div id="foes" class="page on">
  <table>
    <thead><tr id="head"></tr></thead>
    <tbody id="body"></tbody>
  </table>
  <div id="orphans"></div>
</div>

<div id="fights" class="page"></div>

<div id="sheet"><div class="box">
  <h3 id="shTitle">EXPORT</h3>
  <textarea id="shText" spellcheck="false"></textarea>
  <div class="row"><button id="shCopy">COPY TO CLIPBOARD</button>
    <span class="grow"></span><button id="shClose">CLOSE</button></div>
</div></div>

<script>
const D=/*__FOEDEX__*/null;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ── edits: a flat {variant|name|field: value} map, kept OUT of the data ──
   The dex is regenerated from the running game, so an edit written INTO the
   row would be lost the next time somebody re-runs the probe. It lives beside
   the row instead, and EXPORT hands back only what moved. */
const EK='foedex_edits_v1';
let EDITS={};
try{EDITS=JSON.parse(localStorage.getItem(EK))||{};}catch(e){EDITS={};}
const saveEdits=()=>{try{localStorage.setItem(EK,JSON.stringify(EDITS));}catch(e){}};
const ekey=(f,k)=>f.variant+'|'+f.name+'|'+k;
const val=(f,k)=>{const e=EDITS[ekey(f,k)];return e===undefined?f[k]:e;};
const moved=(f,k)=>EDITS[ekey(f,k)]!==undefined;

const HOT={captain:1,champ:1,noRout:1,big:1,bigkill:1,noTrim:1,veiled:1,fireborn:1};

/* an editable cell. `long` is the description column, which wraps. */
function ed(f,k,long){
  return '<span contenteditable="true" data-v="'+esc(f.variant)+'" data-n="'+esc(f.name)+
    '" data-k="'+k+'"'+(long?' style="display:block;min-width:200px;max-width:240px"':'')+
    '>'+esc(val(f,k))+'</span>';
}
function actChip(a,u){
  const cls=a.move?'mv':a.arcane?'arc':a.sweep?'swp':a.range?'rng':a.dmg?'':'util';
  /* MOVE's reach IS the body's stride, which is the one act whose number lives
     on the unit rather than on the act */
  const rr=a.move?((u&&u.speed)||'?')+' hexes':
    a.range?a.range+' hex':a.reach?'reach '+a.reach:'self';
  const dm=a.dmg?'<span class="d">'+a.dmg[0]+'-'+a.dmg[1]+'</span>':'<span class="m">no damage</span>';
  const tags=[a.sweep&&'sweep',a.arcane&&'arcane',a.pull&&('pull '+a.pull),
    a.bounce&&('bounce '+a.bounce),a.cool&&('cool '+a.cool),a.strain&&('strain '+a.strain)]
    .filter(Boolean).join(' · ');
  return '<div class="act '+cls+'" title="'+esc(a.note||a.n)+'"><b>'+esc(a.n)+'</b> '+dm+
    ' <span class="m">'+a.cost+'ap · '+rr+(tags?' · '+tags:'')+'</span></div>';
}
function partyBox(k,me){
  const F=D.fights[k];if(!F)return '';
  /* ⛑ WHICH CARD PUTS YOU HERE IS DERIVED OFF THE DECKS, never authored beside
     the statblock: a door already carries `battle:'<kind>'`, so the road and the
     fire ARE the index. A second list would be the promise-versus-payment shape
     this repo keeps deleting. */
  const cards=(F.cards||[]),seen={};
  const uniq=cards.filter(c=>seen[c.title]?false:(seen[c.title]=1));
  return '<div class="party"><b>'+esc(D.fightName[k]||k)+'</b>'+
    '<span class="pn">'+F.bodies+(F.bodies===1?' body':' bodies')+' · '+F.pts+' pts</span>'+
    '<div class="cast">'+F.cast.map(c=>
      '<span class="'+(c.name===me.name&&c.pts===me.pts?'me':'')+'">'+c.n+'x '+esc(c.name)+
        (twin(c.name)?' <i class="m">('+c.pts+')</i>':'')+'</span>')
      .join('<span class="m">, </span>')+
    (F.allies.length?'<br><span class="ally">with you: '+
      F.allies.map(esc).join(', ')+'</span>':'')+'</div>'+
    '<div class="cards">'+(uniq.length
      ? uniq.map(c=>'<span class="cd '+c.src+'" title="'+esc(cards.filter(x=>
          x.title===c.title).map(x=>x.door).join('   |   '))+'">'+
          (c.src==='fire'?'⛺':'⚔')+' '+esc(c.title)+'</span>').join('')
      : '<span class="cd none">nothing on the road starts this one</span>')+
    '</div></div>';
}

/* ── the readings the table is measured against ─────────────────────────
   ⛔ YOU IS DERIVED AND WAS A LITERAL `10` FOR ONE AFTERNOON, which is exactly
   how long it took `PTS_SCALE` to move underneath it. `ARENA.COMPS.four()` is
   the company the dial is calibrated against, so the tool divides by the same
   thing the dial multiplies by and the two cannot come apart. */
const FOUR=(D.comps&&D.comps.four)||{n:4,pts:40};
const YOU=Math.max(1,Math.round(FOUR.pts/FOUR.n));
const MAXP=Math.max.apply(null,D.foes.map(f=>f.pts));
/* one body, by the SAME name+pts key the probe groups a cast with */
const byKey={};D.foes.forEach(f=>{byKey[f.name+'|'+f.pts]=f;});
/* a name two statblocks share: only then is the price worth printing beside it */
const NCOUNT={};D.foes.forEach(f=>{NCOUNT[f.name]=(NCOUNT[f.name]||0)+1;});
const twin=n=>NCOUNT[n]>1;

/* ── the columns. `n` renders, `sort` sorts, `e` is the field an edit writes ── */
const COLS=[
 {t:'',       cls:'pic', n:f=>{
    const s=D.spr[f.spr];
    return s?'<img src="'+s.src+'" width="'+s.w+'" height="'+s.h+'" alt="">':'<span class="noart">no art</span>';}},
 {t:'Name',   sort:f=>String(val(f,'name')), n:f=>{
    const fl=f.flags.filter(x=>x!=='champ')
      .map(x=>'<i class="fl'+(HOT[x]?' hot':'')+'">'+x+'</i>').join('');
    const ch=champsOf(f),id=f.name+'|'+f.pts;
    return (f.champOf?'<span class="chmark">CHAMPION</span>':'')+
      '<div class="nm" title="'+esc(val(f,'desc'))+'">'+ed(f,'name')+'</div>'+
      '<div class="sub"><span class="rc '+f.race+'">'+f.race+'</span>'+
      (f.tag?'<span class="rc">'+esc(f.tag)+'</span>':'')+fl+'</div>'+
      (ch.length?'<span class="chtog" data-tog="'+esc(id)+'">'+
        (OPEN[id]?'▾':'▸')+' CHAMPION '+
        (ch.length>1?ch.length+' rolls, ':'')+
        ch.map(c=>c.pts).join('/')+' pts</span>':'');}},
 {t:'HP',     cls:'num',sort:f=>+val(f,'hp'),    e:'hp'},
 {t:'Armour', cls:'num',sort:f=>+val(f,'armour'),e:'armour'},
 {t:'Soak',   cls:'num',sort:f=>+val(f,'soak'),  e:'soak'},
 {t:'Mood',   cls:'num',sort:f=>+val(f,'mor'),   e:'mor'},
 {t:'To hit', cls:'num',sort:f=>+val(f,'hit'),   e:'hit'},
 {t:'Dodge',  cls:'num',sort:f=>+val(f,'dodge'), e:'dodge'},
 {t:'Hexes',  cls:'num',sort:f=>+val(f,'speed'), e:'speed'},
 {t:'Acts',   cls:'num',sort:f=>+val(f,'actions'),e:'actions'},
 {t:'Reach',  cls:'num',sort:f=>+val(f,'reach'), e:'reach'},
 {t:'Damage', cls:'num',sort:f=>+val(f,'dmgHi'), n:f=>
    ed(f,'dmgLo')+'<span class="m">-</span>'+ed(f,'dmgHi')},
 {t:'Threat', cls:'num',sort:f=>+val(f,'pts'), n:f=>{
    const p=+val(f,'pts')||0,pc=Math.round(p/YOU*100);
    return '<span class="pts">'+ed(f,'pts')+'</span>'+
      '<span class="ptsb"><i style="width:'+Math.min(100,p/MAXP*100)+'%"></i></span>'+
      '<span class="ptspc">'+pc+'% of a starter</span>';}},
 {t:'Skills', sort:f=>f.acts.length+f.perks.length, n:f=>'<div class="acts">'+
    f.acts.map(a=>actChip(a,f)).join('')+
    /* ⛔ #265 - A CHAMPION ROLLS TWO PERKS AND THEY ARE SKILLS. They are not
       acts, so a list of acts is half of what a champion is. */
    (f.perks.length?f.perks.map(p=>'<div class="act pk" title="'+esc(p.d)+'">'+
      '<b>'+esc(p.n.toUpperCase())+'</b> <span class="m">perk</span></div>').join(''):'')+
    '</div>'},
 {t:'Typical party', sort:f=>f.fights.length, n:f=>'<div class="parties">'+
    f.fights.map(k=>partyBox(k,f)).join('')+'</div>'},
 {t:'Description', n:f=>ed(f,'desc',1)}
];

/* ⛔ A BASE BODY CAN HAVE MORE THAN ONE CHAMPION AND THE FIRST CUT KEPT ONE.
   #265's champion rolls TWO PERKS, so the same statblock comes out of the
   catalogue at two prices (Hold billman at 30 and at 32), and a plain
   `CHOF[champOf]=f` silently dropped whichever came first: five champions in
   the data, four toggles on the page. It is a LIST per base. */
const CHOF={};
D.foes.forEach(f=>{if(f.champOf)(CHOF[f.champOf]=CHOF[f.champOf]||[]).push(f);});
const champsOf=f=>CHOF[f.name+'|'+f.pts]||[];
let OPEN={};

let SORT={i:12,dir:-1},GROUP=true;
function trFor(f,cls){
  return '<tr class="'+cls+'" data-id="'+esc(f.name+'|'+f.pts)+'">'+
    COLS.map(c=>'<td class="'+(c.cls||'')+(c.e&&moved(f,c.e)?' edited':'')+'">'+
      (c.n?c.n(f):ed(f,c.e))+'</td>').join('')+'</tr>';
}
function render(){
  const q=$('q').value.toLowerCase(),rf=$('race').value,ff=$('fight').value;
  const hit=f=>{
    if(rf&&f.race!==rf)return false;
    if(ff&&f.fights.indexOf(ff)<0)return false;
    if(!q)return true;
    return (f.name+' '+f.race+' '+f.kind+' '+f.fam+' '+f.tag+' '+f.desc+' '+
      f.flags.join(' ')+' '+f.acts.map(a=>a.n).join(' ')+' '+
      f.perks.map(p=>p.n).join(' ')+' '+
      f.fights.map(k=>D.fightName[k]||k).join(' ')).toLowerCase().indexOf(q)>=0;
  };
  /* ⚠ A CHAMPION IS SHOWN WHEN ITS BASE MATCHES, and on its own when the base
     does not: a search for "champ" must not return an empty table, and a search
     for "ash-drake" must not silently drop the champion into nowhere. */
  let rows=D.foes.filter(f=>{
    if(!f.champOf)return hit(f);
    const base=D.foes.filter(x=>x.name+'|'+x.pts===f.champOf)[0];
    return base?false:hit(f);          /* a linked champion rides its base */
  });
  const col=COLS[SORT.i];
  if(col&&col.sort)rows.sort((a,b)=>{
    const x=col.sort(a),y=col.sort(b);
    return (x<y?-1:x>y?1:0)*SORT.dir;});

  $('head').innerHTML=COLS.map((c,i)=>'<th class="'+(c.cls||'')+
    (i===SORT.i?' sorted':'')+'" data-i="'+i+'">'+esc(c.t)+
    (i===SORT.i?' <span class="ar">'+(SORT.dir>0?'▲':'▼')+'</span>':'')+'</th>').join('');

  const bodyRow=f=>{
    const cls=(f.flags.indexOf('noTrim')>=0||f.flags.indexOf('captain')>=0)?'boss':'';
    let h=trFor(f,cls);
    const open=OPEN[f.name+'|'+f.pts]?' open':'';
    champsOf(f).forEach(c=>{h+=trFor(c,'champ'+open);});
    return h;
  };
  let html='',shown=0;
  if(GROUP&&(!col||SORT.i===12)){
    /* ⛔ GROUPING IS OFF THE MOMENT A COLUMN IS SORTED, and that is the rule
       rather than a limitation: a header saying DOGS over a list ordered by
       hitpoints is a claim the rows do not support. Threat is the default sort
       and the one the groups are built for. */
    const fams=[];
    rows.forEach(f=>{if(fams.indexOf(f.fam)<0)fams.push(f.fam);});
    fams.sort((a,b)=>{
      const x=D.famOrder.indexOf(a),y=D.famOrder.indexOf(b);
      return (x<0?99:x)-(y<0?99:y);});
    fams.forEach(fam=>{
      const g=rows.filter(f=>f.fam===fam);if(!g.length)return;
      const races=[];g.forEach(f=>{if(races.indexOf(f.race)<0)races.push(f.race);});
      html+='<tr class="grp"><td colspan="'+COLS.length+'">'+
        '<span class="gh">'+esc(fam)+'</span>'+
        '<span class="gr">'+races.join(' / ')+'</span>'+
        '<span class="gn">'+g.length+(g.length===1?' body':' bodies')+' · '+
          g.reduce((s,f)=>s+f.pts,0)+' pts</span></td></tr>';
      g.forEach(f=>{html+=bodyRow(f);shown++;});
    });
  }else{
    rows.forEach(f=>{html+=bodyRow(f);shown++;});
  }
  $('body').innerHTML=html;
  const champs=D.foes.filter(f=>f.champOf).length;
  $('count').textContent=shown+' of '+(D.foes.length-champs)+' bodies'+
    (champs?' · '+champs+' champions folded in':'');
}

/* ── what was drawn and is never shown ────────────────────────────────────
   Every row here was PROVED unreachable by driving the thing that would use it
   (the sprite cascade, the plan builders, the two map tables), never by reading
   a list. `tools/dev/probes/orphanart.js` is that drive, and three of its first
   findings were its own blind spots - the notes in it say which. */
function renderOrphans(){
  const O=D.orphans;const box=$('orphans');
  if(!O){box.innerHTML='';return;}
  const card=(img,name,key,desc)=>'<div class="ocard">'+
    (img?'<img src="'+img.src+'" alt="">':'')+'<div><div class="on1">'+esc(name)+'</div>'+
    (key?'<div class="ok">'+esc(key)+'</div>':'')+
    (desc?'<div class="od">'+esc(desc)+'</div>':'')+'</div></div>';
  const tags=(a,none)=>a&&a.length
    ? '<div class="olist">'+a.map(x=>'<span class="otag"><b>'+esc(x)+'</b></span>').join('')+'</div>'
    : '<div class="none">'+none+'</div>';
  const sec=(t,n,body)=>'<h4>'+t+'<span>'+n+'</span></h4>'+body;

  const sb=(O.statblocks&&O.statblocks.neverFielded)||[];
  const bu=(O.battle&&O.battle.unused)||[];
  let h='<h2>WHAT WAS DRAWN AND IS NEVER SHOWN</h2>'+
    '<div class="lead">Assets and statblocks that exist in the build and that no body, card '+
    'or node can reach. None of this is broken and none of it is a bug: it is work that was '+
    'finished and then out-run by a balance cut or a fight that was never written. It is '+
    'listed so the next pass can either wire it up or take the bytes back.</div>';

  h+=sec('STATBLOCKS NO PLAN EVER FIELDS',sb.length+' of '+D.foes.length,
    sb.length?'<div class="ocards">'+sb.map(r=>card(r.art,r.name,
      r.fight+' / '+r.variant,
      'hp '+r.hp+' · armour '+r.armour+' · mood '+r.mor+' · hit '+r.skill+
      ' · dodge '+r.dodge+'  |  '+(r.acts||[]).join(', '))).join('')+'</div>'
      :'<div class="none">none: every statblock reaches a board</div>');

  h+=sec('BATTLE PAINTINGS NOTHING CAN REACH',
    bu.length+' of '+((O.battle&&O.battle.reached||[]).length+bu.length)+' character sprites',
    bu.length?'<div class="ocards">'+bu.map(u=>card(u.art,u.key.replace(/_/g,' '),u.key,''))
      .join('')+'</div>':'<div class="none">none</div>');

  if(O.stages)h+=sec('WIDE EVENT STAGES WITH NO CARD',(O.stages.unmapped||[]).length,
    tags(O.stages.unmapped,'none'));
  if(O.map)h+=sec('MAP PAINTINGS NO NODE POINTS AT',(O.map.artUnmapped||[]).length,
    tags(O.map.artUnmapped,'none'));
  if(O.events)h+=sec('EVENT ART WITH NO CARD',(O.events.artUnmapped||[]).length,
    tags(O.events.artUnmapped,'none'));
  if(O.items)h+=sec('ITEM ICONS WITH NO GEAR ROW',(O.items.noRow||[]).length,
    tags(O.items.noRow,'none'));
  if(O.bestiary)h+=sec('BESTIARY ROWS WITH NOTHING TO DESCRIBE',(O.bestiary.noBody||[]).length,
    tags(O.bestiary.noBody,'none'));
  box.innerHTML=h;
}

function renderFights(){
  const ks=Object.keys(D.fights).sort((a,b)=>D.fights[a].pts-D.fights[b].pts);
  $('fights').innerHTML=ks.map(k=>{
    const F=D.fights[k],net=Math.max(1,F.pts-F.allyPts);
    return '<div class="fcard"><h3>'+esc(D.fightName[k]||k)+'</h3>'+
      '<div class="k">'+esc(k)+' · '+F.bodies+(F.bodies===1?' body':' bodies')+'</div>'+
      '<div class="bands"><span class="e">EASY<b>'+Math.round(net*1.3)+'</b>bring</span>'+
      '<span>EVEN<b>'+net+'</b>bring</span>'+
      '<span class="h">HARD<b>'+Math.round(net*0.75)+'</b>bring</span></div>'+
      F.cast.map(c=>{const f=byKey[c.name+'|'+c.pts],s=f&&D.spr[f.spr];
        return '<div class="frow">'+(s?'<img src="'+s.src+'" alt="">':'<span style="width:26px"></span>')+
          '<span class="fn">'+esc(c.name)+'</span>'+
          '<span class="fp">'+c.pts+' pts</span>'+
          '<span class="fx">x'+c.n+'</span></div>';}).join('')+
      (F.allies.length?'<div class="fally">stands with you: '+F.allies.map(esc).join(', ')+
        ' ('+F.allyPts+' pts)</div>':'')+
      '<div class="ftot"><span>the side is worth</span><b>'+F.pts+' pts</b></div></div>';
  }).join('');
}

/* ── export ─────────────────────────────────────────────────────────────
   JSON hands back the whole dex WITH the edits folded in, plus the raw edit
   map: a rebuild can then be diffed against it rather than silently
   overwriting somebody's afternoon. */
function sheet(title,text){$('shTitle').textContent=title;$('shText').value=text;
  $('sheet').classList.add('on');}
const FIELDS=['name','hp','armour','soak','mor','hit','dodge','speed','actions','reach',
  'dmgLo','dmgHi','pts','desc'];
function rowOut(f){
  const o={variant:f.variant,race:f.race,kind:f.kind,flags:f.flags,
    fights:f.fights.map(k=>D.fightName[k]||k)};
  FIELDS.forEach(k=>o[k]=val(f,k));
  o.skills=f.acts.map(a=>a.n+' '+(a.dmg?a.dmg[0]+'-'+a.dmg[1]:'-')+' '+a.cost+'ap');
  return o;
}
$('exJson').onclick=()=>sheet('EXPORT - JSON',JSON.stringify(
  {built:D.built,edits:EDITS,foes:D.foes.map(rowOut)},null,1));
$('exCsv').onclick=()=>{
  const head=['name','race','kind','hp','armour','soak','mor','hit','dodge','speed',
    'actions','reach','dmgLo','dmgHi','pts','skills','fights','desc'];
  const lines=[head.join(',')];
  D.foes.forEach(f=>{const o=rowOut(f);
    lines.push(head.map(h=>{
      let v=h==='skills'?o.skills.join(' | '):h==='fights'?o.fights.join(' | '):o[h];
      v=String(v==null?'':v);
      return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(','));});
  sheet('EXPORT - CSV',lines.join('\n'));};
$('exMd').onclick=()=>{
  const head=['Name','Race','HP','Arm','Soak','Mood','Hit','Dodge','Hexes','Acts','Reach',
    'Dmg','Threat','Skills','Typical party','Description'];
  const out=['| '+head.join(' | ')+' |','|'+head.map(()=>'---').join('|')+'|'];
  D.foes.forEach(f=>{const o=rowOut(f);
    out.push('| '+[o.name,f.race,o.hp,o.armour,o.soak,o.mor,o.hit,o.dodge,o.speed,
      o.actions,o.reach,o.dmgLo+'-'+o.dmgHi,o.pts,o.skills.join('<br>'),
      o.fights.join('<br>'),String(o.desc).replace(/\|/g,'/')].join(' | ')+' |');});
  sheet('EXPORT - MARKDOWN',out.join('\n'));};
$('shCopy').onclick=()=>{const t=$('shText');t.select();
  try{document.execCommand('copy');$('shCopy').textContent='COPIED';
    setTimeout(()=>{$('shCopy').textContent='COPY TO CLIPBOARD';},1200);}catch(e){}};
$('shClose').onclick=()=>$('sheet').classList.remove('on');
$('reset').onclick=()=>{if(!confirm('Throw away every edit in this browser?'))return;
  EDITS={};saveEdits();render();};

/* ── wiring ─────────────────────────────────────────────────────────── */
$('body').addEventListener('input',e=>{
  const t=e.target;if(!t.dataset||!t.dataset.k)return;
  const src=D.foes.filter(f=>f.variant===t.dataset.v&&f.name===t.dataset.n)[0];
  if(!src)return;
  const key=ekey(src,t.dataset.k),now=t.textContent;
  if(String(src[t.dataset.k])===now)delete EDITS[key];else EDITS[key]=now;
  saveEdits();
  const td=t.closest('td');if(td)td.classList.toggle('edited',EDITS[key]!==undefined);
});
$('body').addEventListener('click',e=>{
  const t=e.target.closest('.chtog');if(!t)return;
  const id=t.dataset.tog;OPEN[id]=!OPEN[id];render();
});
$('head').addEventListener('click',e=>{
  const th=e.target.closest('th');if(!th)return;
  const i=+th.dataset.i;if(!COLS[i]||!COLS[i].sort)return;
  if(SORT.i===i)SORT.dir*=-1;else{SORT.i=i;SORT.dir=-1;}
  render();
});
['q','race','fight'].forEach(id=>$(id).addEventListener('input',render));
$('tabFoes').onclick=()=>{$('tabFoes').classList.add('on');$('tabFights').classList.remove('on');
  $('foes').classList.add('on');$('fights').classList.remove('on');};
$('tabFights').onclick=()=>{$('tabFights').classList.add('on');$('tabFoes').classList.remove('on');
  $('fights').classList.add('on');$('foes').classList.remove('on');};

/* ── boot ───────────────────────────────────────────────────────────── */
(function(){
  const nCh=D.foes.filter(f=>f.champOf).length;
  $('stamp').textContent='derived off the build of '+D.built+' · '+
    (D.foes.length-nCh)+' bodies + '+nCh+' champions · '+
    Object.keys(D.fights).length+' fights';
  const races=[];D.foes.forEach(f=>{if(races.indexOf(f.race)<0)races.push(f.race);});
  $('race').innerHTML='<option value="">every race</option>'+
    races.sort().map(r=>'<option>'+r+'</option>').join('');
  $('fight').innerHTML='<option value="">every fight</option>'+
    Object.keys(D.fights).sort((a,b)=>(D.fightName[a]||a)<(D.fightName[b]||b)?-1:1)
      .map(k=>'<option value="'+k+'">'+esc(D.fightName[k]||k)+'</option>').join('');
  /* ⛔ EVERY FIGURE IN THIS SENTENCE IS READ, NOT TYPED. It carried "4 bodies /
     37 pts" as prose for one afternoon and PTS_SCALE moved underneath it the
     next morning: the same defect the note itself is describing, on the note. */
  const P=D.comps&&D.comps.prepared;
  $('note').innerHTML=
    'Every figure is what <b>build()</b> actually makes of the statblock: after TRIM, ARM, '+
    'FOE_NERVE and <b>HDA_CUT '+D.hdaCut.toFixed(3)+'</b>, which is what the board shows. '+
    'A starting company is <b>'+FOUR.n+' bodies / '+FOUR.pts+' pts</b>'+
    (P?' and a prepared six is <b>'+P.pts+'</b>':'')+
    ', so one of your people is worth about <b>'+YOU+'</b>. '+
    '<span class="warn">Threat pts are advisory only</span> - they price the practice '+
    'field and the dev bench, never a fight. Dotted cells are editable; EXPORT hands back only '+
    'what you moved.';
  render();renderFights();renderOrphans();
})();
</script>
</body>
</html>
